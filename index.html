<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-256.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solis" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Solis</title>
    <script>
      // Sync theme/font from localStorage before React renders to prevent flash
      (function() {
        try {
          var cached = localStorage.getItem('atomic-settings-cache');
          if (cached) {
            var settings = JSON.parse(cached);
            if (settings.theme) {
              document.documentElement.setAttribute('data-theme', settings.theme);
            }
            if (settings.font) {
              document.documentElement.setAttribute('data-font', settings.font);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
