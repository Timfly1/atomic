# Atomic Server Windows Docker 部署配置
# 使用方法: docker-compose -f docker-compose.windows.yml up -d

services:
  server:
    image: ghcr.io/kenforthewin/atomic-server:latest
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-http://10.70.0.52:8080}
      - ATOMIC_SETUP_TOKEN=${ATOMIC_SETUP_TOKEN:-}
      - ATOMIC_SERVER_READ_POOL_SIZE=${ATOMIC_SERVER_READ_POOL_SIZE:-16}
      - ATOMIC_SQLITE_CACHE_KB=${ATOMIC_SQLITE_CACHE_KB:-64000}
      - ATOMIC_SQLITE_READ_CACHE_KB=${ATOMIC_SQLITE_READ_CACHE_KB:-8000}
      - ALLOW_ALL_CORS=${ALLOW_ALL_CORS:-true}
      # AI Provider (OpenRouter API Key 从数据库读取)
      - PROVIDER=${PROVIDER:-openrouter}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
      - OLLAMA_LLM_MODEL=${OLLAMA_LLM_MODEL:-llama3.2}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # OCR
      - TESSERACT_HOST=${TESSERACT_HOST:-http://10.70.0.52:8080}
      - PADDLEOCR_HOST=${PADDLEOCR_HOST:-http://10.70.0.52:8081}
    volumes:
      - type: bind
        source: D:/atomic/databases
        target: /data
    networks:
      - atomic-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    image: ghcr.io/kenforthewin/atomic-web:latest
    networks:
      - atomic-net
    restart: unless-stopped

  proxy:
    image: nginx:1.28-bookworm
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - atomic-net
    depends_on:
      - server
      - web
    restart: unless-stopped

networks:
  atomic-net:
    driver: bridge